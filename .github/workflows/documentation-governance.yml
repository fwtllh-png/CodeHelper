name: Documentation Governance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: documentation-governance
  cancel-in-progress: false

jobs:
  facts-and-freshness:
    name: Facts and freshness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check source and verification drift
        run: python3 scripts/check-doc-governance.py check --strict-drift

      - name: Verify release documentation facts
        run: make release-fact-check

      - name: Check external links
        run: make doc-external-links
