name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check documentation
        run: |
          make docs-check
          make book-check

      - name: Check pull request documentation impact
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/check-doc-governance.py impact \
            --base '${{ github.event.pull_request.base.sha }}' \
            --head '${{ github.event.pull_request.head.sha }}'

  hermetic:
    name: Hermetic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check tracked-file whitespace
        run: |
          if git grep -n -I -E '[[:blank:]]+$' -- \
            ':!go.sum' ':!extensions/vscode/package-lock.json'; then
            echo "tracked files contain trailing whitespace" >&2
            exit 1
          fi

      - name: Build
        run: make build

      - name: Run hermetic lane
        run: make test-hermetic

      - name: Upload lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-lane-hermetic
          path: .tmp/test-lanes/hermetic.json
          if-no-files-found: error

  platform-capability:
    name: Platform capability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux sandbox dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap

      - name: Run required platform capability lane
        run: make test-platform-capability CAPABILITY_REQUIRED=--require-available

      - name: Upload lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-lane-platform-capability
          path: .tmp/test-lanes/platform-capability.json
          if-no-files-found: error

  shared-protocol:
    name: Shared protocol and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check protocol, binary smoke, and cross-build
        run: make protocol-contract smoke cross-build

  vscode:
    name: VS Code check and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Check and test extension
        run: make vscode-check vscode-test

  runtime-integration:
    name: Runtime integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Run real binary integration lane
        run: make test-integration INTEGRATION_REQUIRED=--require-available

      - name: Upload lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-lane-integration
          path: .tmp/test-lanes/integration.json
          if-no-files-found: error

  release:
    name: Release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Run release lane
        run: make test-release

      - name: Upload lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-lane-release
          path: .tmp/test-lanes/release.json
          if-no-files-found: error
