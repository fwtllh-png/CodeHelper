name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      previous_release_ref:
        description: Previous released Git ref used by the downgrade drill
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check documentation
        run: |
          make docs-check
          make book-check

      - name: Check pull request documentation impact
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/check-doc-governance.py impact \
            --base '${{ github.event.pull_request.base.sha }}' \
            --head '${{ github.event.pull_request.head.sha }}'

  hermetic:
    name: Hermetic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Web dependencies
        run: npm --prefix web ci

      - name: Check tracked-file whitespace
        run: |
          if git grep -n -I -E '[[:blank:]]+$' -- \
            ':!go.sum' ':!web/package-lock.json'; then
            echo "tracked files contain trailing whitespace" >&2
            exit 1
          fi

      - name: Build
        run: make build

      - name: Run hermetic lane
        run: make test-hermetic

      - name: Upload lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-lane-hermetic
          path: .tmp/test-lanes/hermetic.json
          if-no-files-found: error

  platform-capability:
    name: Platform capability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux sandbox dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap

      - name: Run required platform capability lane
        run: make test-platform-capability CAPABILITY_REQUIRED=--require-available

      - name: Upload lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-lane-platform-capability
          path: .tmp/test-lanes/platform-capability.json
          if-no-files-found: error

  shared-protocol:
    name: Shared protocol and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Web dependencies
        run: npm --prefix web ci

      - name: Check protocol, binary smoke, and cross-build
        run: make protocol-contract smoke cross-build

  web:
    name: Web check, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Chromium for Web E2E
        run: |
          npm --prefix web ci
          npm --prefix web exec -- playwright install --with-deps chromium

      - name: Check generated Web contracts and assets
        run: make web-protocol-check web-experience-check web-assets-check

      - name: Test and attest Web parity
        run: make web-parity-report

      - name: Upload Web parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-feature-parity-report
          path: .tmp/web-feature-parity-report.json
          if-no-files-found: error

  runtime-integration:
    name: Runtime integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run real binary integration lane
        run: make test-integration INTEGRATION_REQUIRED=--require-available

      - name: Upload lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-lane-integration
          path: .tmp/test-lanes/integration.json
          if-no-files-found: error

  release:
    name: Cutover and release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Web release dependencies
        run: |
          npm --prefix web ci
          npm --prefix web exec -- playwright install --with-deps chromium

      - name: Run release lane
        env:
          PREVIOUS_RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.previous_release_ref || vars.CODEHELPER_PREVIOUS_RELEASE_REF }}
        run: |
          test -n "$PREVIOUS_RELEASE_REF" || {
            echo "Configure CODEHELPER_PREVIOUS_RELEASE_REF to the immutable ref of the previous official release" >&2
            exit 2
          }
          ./scripts/validate-release-ref.sh "$PREVIOUS_RELEASE_REF" >/dev/null
          make test-release PREVIOUS_RELEASE_REF="$PREVIOUS_RELEASE_REF"

      - name: Upload lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-lane-release
          path: |
            .tmp/test-lanes/release.json
            .tmp/release/web-downgrade-drill.json
            .tmp/web-supply-chain-report.json
            .tmp/web-npm-audit.json
          if-no-files-found: error
