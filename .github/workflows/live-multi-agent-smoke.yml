name: Live Multi-Agent Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-multi-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: live-model
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run credentialed Multi-Agent smoke
        env:
          LIVE_MODEL_BASE_URL: ${{ secrets.LIVE_MODEL_BASE_URL }}
          LIVE_MODEL_WIRE_MODEL: ${{ secrets.LIVE_MODEL_WIRE_MODEL }}
          LIVE_MODEL_API_KEY: ${{ secrets.LIVE_MODEL_API_KEY }}
          LIVE_MODEL_NAME: ${{ vars.LIVE_MODEL_NAME }}
          LIVE_MODEL_PROTOCOL: ${{ vars.LIVE_MODEL_PROTOCOL }}
          CODEHELPER_STAGE_EVIDENCE_PATH: .tmp/live-multi-agent-smoke.json
          CODEHELPER_STAGE: live-multi-agent
          CODEHELPER_STAGE_RUN_ID: ${{ github.run_id }}
        run: |
          test -n "$LIVE_MODEL_BASE_URL"
          test -n "$LIVE_MODEL_WIRE_MODEL"
          test -n "$LIVE_MODEL_API_KEY"
          export LIVE_MODEL_NAME="${LIVE_MODEL_NAME:-live-provider}"
          export LIVE_MODEL_PROTOCOL="${LIVE_MODEL_PROTOCOL:-openai_chat}"
          export CODEHELPER_STAGE_SOURCE_DIGEST="$(git rev-parse HEAD)"
          make live-multi-agent-smoke

      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-multi-agent-smoke
          path: .tmp/live-multi-agent-smoke.json
          if-no-files-found: error
